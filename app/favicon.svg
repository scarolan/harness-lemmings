  <!-- Row 6 -->
  <rect x="4" y="6" width="8" height="1" class="s" />
  <!-- Row 7 (Face & Eyes) -->
  <rect x="4" y="7" width="1" height="1" class="s" />
  <rect x="5" y="7" width="1" height="1" class="w" />
  <rect x="6" y="7" width="1" height="1" class="k" />
  <rect x="7" y="7" width="2" height="1" class="s" />
