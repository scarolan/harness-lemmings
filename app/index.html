<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lemmings - Deployed by Harness</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            padding: 20px;
        }
        .header h1 {
            font-size: 2.5em;
            color: #44ff44;
            text-shadow: 0 0 10px #00ff00, 0 0 20px #00cc00;
            letter-spacing: 4px;
        }
        .header p {
            color: #888;
            margin-top: 8px;
            font-size: 0.9em;
        }
        .header .pipeline-badge {
            display: inline-block;
            background: #0f62fe;
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.8em;
            margin-top: 10px;
        }
        #jsdos {
            width: 640px;
            height: 400px;
            border: 2px solid #44ff44;
            box-shadow: 0 0 20px rgba(68, 255, 68, 0.3);
            position: relative;
            overflow: hidden;
        }
        /* Hide js-dos overlay UI (save/load icons) */
        #jsdos .sidebar-header, #jsdos .sidebar,
        #jsdos [class*="save"], #jsdos [class*="load"],
        #jsdos .jsdos-player-button,
        #jsdos .button-save, #jsdos .button-load {
            display: none !important;
        }
        .controls {
            margin-top: 15px;
            color: #666;
            font-size: 0.8em;
            text-align: center;
        }
        .controls kbd {
            background: #333;
            border: 1px solid #555;
            border-radius: 3px;
            padding: 2px 6px;
            margin: 0 2px;
        }
        .footer {
            margin-top: 20px;
            padding: 15px;
            text-align: center;
            color: #555;
            font-size: 0.75em;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>LEMMINGS</h1>
        <p>Oh no!</p>
        <span class="pipeline-badge">Deployed by Harness CI/CD</span>
    </div>

    <div id="jsdos"></div>

    <div class="controls">
        <p>
            <kbd>Mouse</kbd> Point & Click |
            <kbd>Space</kbd> Pause |
            <kbd>Esc</kbd> Nuke / Cancel |
            <kbd>F1-F10</kbd> Select Skill
        </p>
        <p style="margin-top: 8px;">Click the game area to capture mouse/keyboard</p>
    </div>

    <div class="footer">
        <p>Lemmings &copy; 1991 DMA Design / Psygnosis | Emulated via js-dos</p>
        <p>Built, tested, and deployed through a Harness pipeline.</p>
    </div>

    <script src="https://unpkg.com/js-dos@8.4.1/dist/js-dos.js"></script>
    <script>
        Dos(document.getElementById("jsdos"), {
            url: "/lemmings.jsdos",
            pathPrefix: "https://unpkg.com/emulators@8.4.1/dist/",
            autoStart: true,
        });
    </script>
</body>
</html>
